<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI STUDIO PAUL</title>
  <meta name="description" content="AI STUDIO PAUL — サムネイルグリッドポートフォリオ">
  <meta property="og:title" content="AI STUDIO PAUL">
  <meta property="og:description" content="AI STUDIO PAUL — サムネイルグリッドポートフォリオ">
  <meta property="og:image" content="https://paul13131313.github.io/studio-paul/ogp.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .header {
      background: #000;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
    }

    .header-copy {
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      color: #fff;
      line-height: 1.4;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }

    .panel {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
    }

    .panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .panel-placeholder {
      width: 100%;
      height: 100%;
    }

    .panel-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      padding: 0.5rem;
    }

    .panel:hover .panel-overlay {
      opacity: 1;
    }

    .panel-title {
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: clamp(0.7rem, 1.2vw, 1rem);
      letter-spacing: -0.03em;
      color: #fff;
      text-align: center;
      word-break: break-word;
      line-height: 1.4;
    }

    /* Badge */
    .panel-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 2px 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      border-radius: 2px;
      z-index: 2;
      pointer-events: none;
    }

    .badge-new {
      background: #fff;
      color: #000;
    }

    .badge-hot {
      background: #ff3b30;
      color: #fff;
    }

    /* モバイル: hover がないデバイス */
    @media (hover: none) {
      .panel-overlay {
        opacity: 1;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 60%);
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 0.5rem 0.5rem 0.5rem;
      }

      .panel-title {
        text-align: left;
        font-size: clamp(0.6rem, 2.5vw, 0.85rem);
      }
    }

    /* Accordion */
    .panel.hidden-panel {
      display: none;
    }

    .panel.hidden-panel.show {
      display: block;
    }

    .expand-btn {
      display: block;
      width: 100%;
      padding: 1.2rem;
      background: #000;
      border: none;
      color: #666;
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: color 0.2s;
    }

    .expand-btn:hover {
      color: #fff;
    }

    /* レスポンシブ: 列数 */
    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .header {
        padding: 0.8rem 1rem;
      }

      .header-title {
        font-size: 0.7rem;
      }

      .header-copy {
        font-size: 0.5rem;
      }

      .panel-badge {
        top: 4px;
        left: 4px;
        font-size: 0.5rem;
        padding: 1px 5px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <span class="header-title">AI STUDIO PAUL</span>
  </header>
  <main class="grid" id="grid"></main>
  <button class="expand-btn" id="expandBtn" style="display:none"></button>

  <script>
    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTK9SAFKJrv3hyi6mulfb3HAaiAYmu0dKx8MOw5gwX4LJtOanKVMoti5DoDVRwix3DHsKX9KqsBF9si/pub?output=csv';
    const CLICKS_API = 'https://studio-clicks.hiroshinagano0113.workers.dev';

    function parseCSV(text) {
      const lines = text.split('\n').filter(l => l.trim());
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = [];
        let current = '';
        let inQuotes = false;
        for (const ch of lines[i]) {
          if (ch === '"') { inQuotes = !inQuotes; }
          else if (ch === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
          else { current += ch; }
        }
        cols.push(current.trim());
        if (cols[0]) rows.push({
          title:     cols[0],
          url:       cols[1] || '',
          desc:      cols[2] || '',
          category:  (cols[3] || '').toUpperCase().trim(),
          emoji:     cols[4] || '🔗',
          bg:        cols[5] || 'linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%)',
          color:     cols[6] || '#e8e0d0',
          font:      cols[7] || 'ja',
          desc_en:   cols[8] || '',
          title_en:  cols[9] || '',
          thumbnail: cols[10] || ''
        });
      }
      return rows;
    }

    function slugify(url) {
      return url
        .replace(/^https?:\/\//, '')
        .replace(/paul13131313\.github\.io\//, '')
        .replace(/\.vercel\.app\/?/, '')
        .replace(/\.com\/?/, '')
        .replace(/[^a-zA-Z0-9]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '')
        .toLowerCase() || 'item';
    }

    function renderGrid(items, clickCounts) {
      const grid = document.getElementById('grid');

      // Build click count map (slug → count)
      const countMap = {};
      for (const c of clickCounts) {
        countMap[c.slug] = c.count;
      }

      // NEW = first item in spreadsheet
      const newItem = items[0];

      // Sort all items (except NEW) by click count desc, then by spreadsheet order
      const rest = items.slice(1).map((item, i) => ({
        ...item,
        _origIndex: i,
        _clicks: countMap[slugify(item.url)] || 0
      }));
      rest.sort((a, b) => {
        if (b._clicks !== a._clicks) return b._clicks - a._clicks;
        return a._origIndex - b._origIndex;
      });

      // Final order: NEW → sorted rest
      // Top 3 with clicks > 0 get HOT badge
      const ordered = [];
      if (newItem) ordered.push({ ...newItem, badge: 'new' });
      let hotCount = 0;
      for (const item of rest) {
        if (hotCount < 3 && item._clicks > 0) {
          ordered.push({ ...item, badge: 'hot' });
          hotCount++;
        } else {
          ordered.push(item);
        }
      }

      const VISIBLE_COUNT = 16;
      let html = '';
      for (let idx = 0; idx < ordered.length; idx++) {
        const item = ordered[idx];
        const title = item.title;
        const href = item.url ? ` href="${item.url}" target="_blank" rel="noopener"` : '';
        const slug = slugify(item.url);
        const thumbUrl = `thumbs/${slug}.webp?v=7`;
        const hiddenClass = idx >= VISIBLE_COUNT ? ' hidden-panel' : '';

        let badgeHtml = '';
        if (item.badge === 'new') {
          badgeHtml = '<span class="panel-badge badge-new">NEW</span>';
        } else if (item.badge === 'hot') {
          badgeHtml = '<span class="panel-badge badge-hot">HOT</span>';
        }

        html += `<a${href} class="panel${hiddenClass}" data-slug="${slug}">` +
          badgeHtml +
          `<img src="${thumbUrl}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">` +
          `<div class="panel-placeholder" style="background:${item.bg};display:none"></div>` +
          `<div class="panel-overlay"><span class="panel-title">${title}</span></div>` +
          `</a>`;
      }

      grid.innerHTML = html;

      // Accordion button
      const hiddenCount = ordered.length - VISIBLE_COUNT;
      const expandBtn = document.getElementById('expandBtn');
      if (hiddenCount > 0) {
        expandBtn.textContent = `+ MORE (${hiddenCount})`;
        expandBtn.style.display = 'block';
        let expanded = false;
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          const hiddenPanels = grid.querySelectorAll('.hidden-panel');
          hiddenPanels.forEach(p => p.classList.toggle('show', expanded));
          expandBtn.textContent = expanded ? '− CLOSE' : `+ MORE (${hiddenCount})`;
        });
      }

      // Track clicks
      grid.addEventListener('click', (e) => {
        const panel = e.target.closest('.panel');
        if (!panel) return;
        const slug = panel.dataset.slug;
        if (slug) {
          navigator.sendBeacon(`${CLICKS_API}/click?slug=${encodeURIComponent(slug)}`);
        }
      });
    }

    // Fetch CSV and all click counts in parallel
    Promise.all([
      fetch(SHEET_CSV).then(r => r.text()),
      fetch(`${CLICKS_API}/all`).then(r => r.json()).catch(() => [])
    ]).then(([csvText, allCounts]) => {
      const items = parseCSV(csvText);
      renderGrid(items, allCounts);
    }).catch(err => {
      console.error('Load error:', err);
    });
  </script>
</body>
</html>
