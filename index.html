<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI STUDIO PAUL</title>
  <meta name="description" content="AI STUDIO PAUL — サムネイルグリッドポートフォリオ">
  <meta property="og:title" content="AI STUDIO PAUL">
  <meta property="og:description" content="AI STUDIO PAUL — サムネイルグリッドポートフォリオ">
  <meta property="og:image" content="https://paul13131313.github.io/studio-paul/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .header {
      background: #000;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
    }

    .header-copy {
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      color: #fff;
      line-height: 1.4;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }

    .panel {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
    }

    .panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .panel-placeholder {
      width: 100%;
      height: 100%;
    }

    .panel-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      padding: 0.5rem;
    }

    .panel:hover .panel-overlay {
      opacity: 1;
    }

    .panel-title {
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: clamp(0.7rem, 1.2vw, 1rem);
      letter-spacing: -0.03em;
      color: #fff;
      text-align: center;
      word-break: break-word;
      line-height: 1.4;
    }

    /* モバイル: hover がないデバイス */
    @media (hover: none) {
      .panel-overlay {
        opacity: 1;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 60%);
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 0.5rem 0.5rem 0.5rem;
      }

      .panel-title {
        text-align: left;
        font-size: clamp(0.6rem, 2.5vw, 0.85rem);
      }
    }

    /* レスポンシブ: 列数 */
    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .header {
        padding: 0.8rem 1rem;
      }

      .header-title {
        font-size: 0.7rem;
      }

      .header-copy {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <span class="header-title">AI STUDIO PAUL</span>
    <span class="header-copy">100 Contents with VibeCoding</span>
  </header>
  <main class="grid" id="grid"></main>

  <script>
    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTK9SAFKJrv3hyi6mulfb3HAaiAYmu0dKx8MOw5gwX4LJtOanKVMoti5DoDVRwix3DHsKX9KqsBF9si/pub?output=csv';

    function parseCSV(text) {
      const lines = text.split('\n').filter(l => l.trim());
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = [];
        let current = '';
        let inQuotes = false;
        for (const ch of lines[i]) {
          if (ch === '"') { inQuotes = !inQuotes; }
          else if (ch === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
          else { current += ch; }
        }
        cols.push(current.trim());
        if (cols[0]) rows.push({
          title:     cols[0],
          url:       cols[1] || '',
          desc:      cols[2] || '',
          category:  (cols[3] || '').toUpperCase().trim(),
          emoji:     cols[4] || '🔗',
          bg:        cols[5] || 'linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%)',
          color:     cols[6] || '#e8e0d0',
          font:      cols[7] || 'ja',
          desc_en:   cols[8] || '',
          title_en:  cols[9] || '',
          thumbnail: cols[10] || ''
        });
      }
      return rows;
    }

    function slugify(url) {
      return url
        .replace(/^https?:\/\//, '')
        .replace(/paul13131313\.github\.io\//, '')
        .replace(/\.vercel\.app\/?/, '')
        .replace(/\.com\/?/, '')
        .replace(/[^a-zA-Z0-9]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '')
        .toLowerCase() || 'item';
    }

    function renderGrid(items) {
      const grid = document.getElementById('grid');
      let html = '';

      for (const item of items) {
        const title = item.title;
        const href = item.url ? ` href="${item.url}" target="_blank" rel="noopener"` : '';
        const slug = slugify(item.url);
        const thumbUrl = `thumbs/${slug}.webp`;

        html += `<a${href} class="panel">` +
          `<img src="${thumbUrl}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">` +
          `<div class="panel-placeholder" style="background:${item.bg};display:none"></div>` +
          `<div class="panel-overlay"><span class="panel-title">${title}</span></div>` +
          `</a>`;
      }

      grid.innerHTML = html;
    }

    fetch(SHEET_CSV)
      .then(r => r.text())
      .then(text => {
        const items = parseCSV(text);
        renderGrid(items);
      })
      .catch(err => {
        console.error('CSV fetch error:', err);
      });
  </script>
</body>
</html>
